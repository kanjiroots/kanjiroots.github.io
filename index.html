<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KanjiRoots — Free Worksheets</title>
<style>
  :root{
    --bg-top:#f7f0e0; --bg-bottom:#e9dcc0;
    --frame:rgba(138,74,16,0.30); --rule:#c08020;
    --title:#2a1f14; --text:#241a10; --sub:#6a5a44;
    --card-bg:#fffdf8; --card-shadow:rgba(90,60,20,0.12);
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh;
    background:linear-gradient(180deg,var(--bg-top),var(--bg-bottom));
    font-family:-apple-system,"Hiragino Sans","Yu Gothic",system-ui,sans-serif;
    color:var(--text);
    display:flex; flex-direction:column; align-items:center;
    padding:48px 20px 80px;
  }
  .wrap{ width:100%; max-width:640px; }
  header{ text-align:center; margin-bottom:36px; }
  .kanji{
    font-size:64px; line-height:1; color:var(--title);
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
  }
  h1{
    font-size:26px; margin:12px 0 6px; color:var(--title);
    letter-spacing:0.01em;
  }
  .sub{ font-size:15px; color:var(--sub); margin:0; }
  .list{ display:flex; flex-direction:column; gap:14px; }

  /* ── 1話ぶんのカード。次の話を足すときは、このdiv.cardごとコピーして
        - kanji, family-en/family-ja, desc, href, label を書き換えてください ── */
  .card{
    display:flex; align-items:center; gap:16px;
    background:var(--card-bg); border:1px solid var(--frame);
    border-radius:14px; padding:16px 18px;
    box-shadow:0 2px 10px var(--card-shadow);
    text-decoration:none; color:inherit;
  }
  .card .ck{
    flex:0 0 auto; width:52px; height:52px; border-radius:10px;
    background:var(--bg-top); border:1px solid var(--frame);
    display:flex; align-items:center; justify-content:center;
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:28px; color:var(--title);
  }
  .card .info{ flex:1 1 auto; min-width:0; }
  .card .family{ font-weight:600; font-size:16px; color:var(--title); }
  .card .family .ja{ font-weight:400; color:var(--sub); font-size:13px; margin-left:6px; }
  .card .desc{ font-size:13px; color:var(--sub); margin-top:2px; }
  .card .go{
    flex:0 0 auto; font-size:13px; color:var(--rule); font-weight:600;
    border:1px solid var(--rule); border-radius:999px; padding:6px 14px;
    white-space:nowrap;
  }

  footer{ text-align:center; margin-top:44px; font-size:13px; color:var(--sub); }
  footer a{ color:var(--rule); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="kanji">根</div>
    <h1>KanjiRoots — Free Worksheets</h1>
    <p class="sub">Printable PDFs for each episode · free for classroom use</p>
  </header>

  <div class="list">

    <!-- ▼▼ ここから1話ぶん。次の話を足すときはこのcardごとコピーして書き換える ▼▼ -->
    <a class="card" href="ki-family-workbook.pdf">
      <div class="ck">気</div>
      <div class="info">
        <div class="family">Ki family <span class="ja">気のなかま</span></div>
        <div class="desc">元気・天気・空気 and 7 more — writing, reading &amp; particle practice</div>
      </div>
      <div class="go">PDF ↓</div>
    </a>
    <!-- ▲▲ ここまで1話ぶん ▲▲ -->

  </div>

  <footer>
    ▶ Watch the videos: <a href="https://www.youtube.com/@KanjiRootsJP">youtube.com/@KanjiRootsJP</a><br>
    © 2026 KanjiRoots · free to copy for classroom use · not for sale or re-upload
  </footer>

</div>
</body>
</html>
